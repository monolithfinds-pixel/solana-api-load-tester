name: Solana API Load Test
on:
  schedule:
    - cron: "0 */12 * * *"  # Runs automatically every 12 hours
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Solana Python Library
        run: pip install solana solders
      - name: Run Farming Bot
        run: python bot.py
        env:
          SOL_PRIVATE_KEY: ${{ secrets.SOL_PRIVATE_KEY }}
