name: Multi-Chain Matrix
on:
  schedule:
    - cron: "0 */12 * * *"  # Runs automatically every 12 hours
  workflow_dispatch:

jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: pip install solders requests
      - name: Run Matrix Bot
        run: python matrix.py
        env:
          SOL_PRIVATE_KEYS: ${{ secrets.SOL_PRIVATE_KEYS }}
          HELIUS_RPC_URLS: ${{ secrets.HELIUS_RPC_URLS }}
